  // 옛 주소(github.io) → 전용 주소 minsung-goals.web.app (2026-10-15 이전).
  // 2026-11-17: 「새 주소로 이동」 띠만 띄우던 것을 바로 넘기도록 바꿨다 — 옛 주소는 다른 웹앱들과 저장소를 나눠 쓰는 주소인데
  // 앱이 거기서 통째로 돌며 목표·일정 사본을 그 저장소에 두고 있었다. 목표·일정은 계정(서버)에 있어 실어 보낼 것이 없다.
  // 이 주소에 남은 이 앱의 것(사본·설정·서비스워커·캐시)만 지우고 넘긴다.
  // ⚠ 로그인 저장소(firebaseLocalStorageDb)는 건드리지 않는다 — 같은 주소의 다른 앱이 같은 로그인을 나눠 쓴다
  (function () {
    if (!/(^|\.)github\.io$/.test(location.hostname)) return;
    window.__goalsMoved = true;   // 아래 Firebase 시작·app.js 의 화면 그리기·서비스워커 등록이 이 표시를 보고 아무것도 하지 않는다
    try { ['wm_cache_v1', 'wm_signed_in', 'wm-dark'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
    try { document.documentElement.style.visibility = 'hidden'; } catch (e) {}   // 넘어가기 전 빈 화면이 비치지 않게
    var go = function () { location.replace('https://minsung-goals.web.app/'); };
    try {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.filter(function (r) { return /\/work-manager\//.test(r.scope); }).map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.filter(function (k) { return k.indexOf('wm-cache-') === 0; }).map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.race([Promise.all(jobs), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
    } catch (e) { go(); }
  })();
  </script>
