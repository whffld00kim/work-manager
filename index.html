<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="목표 관리" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>목표 관리자</title>

  <!-- React -->
  <!-- 버전을 정확히 고정한다 (2026-09-03). @18처럼 두면 CDN이 다른 18.x를 줄 때 동작이 바뀔 수 있다. sw.js 캐시 목록과 맞출 것 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase (compat — book-tracker와 같은 버전) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <script>tailwind.config = { darkMode: 'class' };</script>

  <style>
/* 맨 위에서 아래로 당기면 크롬이 페이지를 새로고침하던 것을 막는다 (2026-09-28 사용자 요청 — 새로고침되며 로그인 화면이 다시 떴다) */
html, body { overscroll-behavior-y: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    * { box-sizing: border-box; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    header { padding-top: env(safe-area-inset-top); }

    /* ============ 태블릿 (2026-09-28) ============
       갤럭시 탭을 가로로 두고 쓸 때. 폰 화면은 건드리지 않고 넓을 때만 덮어쓴다.
       - 헤더는 한 줄 (제목 · 탭 · 분류 · 도구)
       - 왼쪽 목록 | 오른쪽 상세 (고르기 전엔 한눈에 보기). 상세가 옆에서 덮는 창 대신 오른쪽 칸에 열린다
       - 화면 높이를 채우고 두 칸이 각자 스크롤
       Tailwind CDN 스타일이 이 태그보다 뒤에 붙으므로 #root를 앞에 붙여 이긴다.
       JS 쪽 판정은 useMQ(TABLET_MQ) — 조건을 바꾸면 둘 다 바꿀 것. 폴드 펼침 블록은 아래 따로 */
    @media (min-width: 900px) and (orientation: landscape) {
      html { font-size: 17px; }
      #root .wm-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }

      /* ── 헤더 한 줄 ── */
      #root .wm-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 18px;
        padding-left: max(24px, calc((100% - 1320px) / 2 + 24px));
        padding-right: max(16px, calc((100% - 1320px) / 2 + 16px));
      }
      #root .wm-head-top { display: contents; }
      #root .wm-head-title { flex: 0 0 auto; font-size: 1.15rem; padding: 14px 0; }
      #root .wm-head-filters {
        order: 1;
        flex: 1 1 auto;
        min-width: 0;
        max-width: none;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #root .wm-head-filters > * { margin-top: 0; }
      #root .wm-head-filters button { padding-top: 7px; padding-bottom: 7px; }
      #root .wm-chips { flex: 1 1 auto; min-width: 0; padding-bottom: 0; }
      #root .wm-chips button { padding-left: 13px; padding-right: 13px; font-size: .8rem; }
      #root .wm-head-tools { order: 2; flex: 0 0 auto; margin-left: 0; }
      #root .wm-head-tools button { padding: 10px; font-size: 1.05rem; }

      /* ── 목록 | 상세 ── */
      #root .wm-split {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 24px;
        display: grid;
        grid-template-columns: 420px minmax(0, 1fr);
        gap: 20px;
      }
      #root .wm-list {
        max-width: none;
        margin: 0;
        padding: 18px 4px 96px;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      /* 목록이 짧으면 카드가 조금씩 커져서 칸을 채운다 (길면 그대로 스크롤) */
      #root .wm-card {
        flex: 1 0 auto;
        max-height: 132px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 16px 18px;
      }
      #root .wm-card-active { box-shadow: 0 0 0 2px #3b82f6, 0 4px 14px rgba(37,99,235,.18); }
      #root .wm-fab {
        right: auto;
        left: calc(max(0px, (100vw - 1320px) / 2) + 24px + 420px - 56px - 14px);
        bottom: 22px;
      }

      #root .wm-pane {
        min-height: 0;
        padding: 18px 0;
        display: flex;
        flex-direction: column;
      }

      /* ── 상세: 오른쪽 칸 안에서 두 단 ── */
      #root .wm-detail-inline {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }
      #root .wm-detail-scroll {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #root .wm-detail-scroll > .sticky { padding: 12px 18px; }
      #root .wm-d-body {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto 1fr;
        gap: 16px;
        padding: 18px;
      }
      #root .wm-d-body > * { margin-top: 0; }
      #root .wm-d-info { grid-column: 1 / -1; }
      /* 왼쪽 단: 이미지·체크리스트·(맨 아래로 밀린) 삭제 / 오른쪽 단: 일정 연동·진행 로그(남는 높이를 채운다) */
      #root .wm-d-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      #root .wm-d-spacer { flex: 1 1 auto; }
      #root .wm-d-log { flex: 1 1 auto; }
      #root .wm-d-created { padding-bottom: 0; margin-top: -8px; }
      #root .wm-d-info, #root .wm-d-col > div:not(.wm-d-spacer) { padding: 18px; }
      #root .wm-d-thumbs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      #root .wm-d-info button { padding: 8px 16px; }

      /* ── 한눈에 보기 ── */
      #root .wm-overview {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        gap: 16px;
      }
      #root .wm-ov-tiles {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      #root .wm-ov-col { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
      #root .wm-ov-cats { grid-column: 1 / -1; }
      #root .wm-ov-catlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 32px; }
      #root .wm-ov-hint { grid-column: 1 / -1; text-align: center; }
      #root .wm-ov-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 11px 8px;
        border-radius: 8px;
        border-bottom: 1px solid rgba(148,163,184,.18);
      }
      #root .wm-ov-row:last-child { border-bottom: none; }
      #root .wm-ov-row:hover { background: rgba(148,163,184,.12); }

      /* ── 새 과제: 가운데 창 ── */
      #root .wm-form { max-width: 560px; padding: 26px; }
    }

    /* ============ 폴드7 펼친 화면 · 태블릿 세로 (2026-10-09) ============
       폭 600 이상인데 태블릿 가로는 아닌 화면 — 폴드7 펼침(약 750×830), 탭 S7+ 세로.
       사용자: 상세가 옆에서 덮는 창이라 왼쪽이 어둡게 남고, 사진이 제목 위로 올라와 보기 안 좋다.
       규칙(LifeOS apps-internals/references/screen-layout.md): 글자 크기는 폰 그대로, 자리만 — 태블릿처럼 목록|상세 두 칸,
       상세 안은 폰처럼 한 줄로 쌓는다(칸이 420px쯤이라 두 단은 좁다). 헤더는 폰 그대로 두 줄.
       JS 판정은 FOLD_MQ — 조건을 바꾸면 둘 다 바꿀 것 */
    @media (min-width: 600px) and (max-width: 899px) and (min-height: 500px), (min-width: 600px) and (orientation: portrait) {
      #root .wm-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }
      #root .wm-header { flex: 0 0 auto; }
      #root .wm-head-top, #root .wm-head-filters { max-width: none; }

      /* ── 목록 | 상세 ── */
      #root .wm-split {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
      }
      #root .wm-list {
        max-width: none;
        margin: 0;
        padding: 14px 2px 96px;
        min-height: 0;
        overflow-y: auto;
      }
      #root .wm-card-active { box-shadow: 0 0 0 2px #3b82f6, 0 4px 14px rgba(37,99,235,.18); }
      #root .wm-fab {
        right: auto;
        left: calc(16px + 300px - 56px - 10px);
        bottom: 20px;
      }
      #root .wm-pane {
        min-height: 0;
        padding: 14px 0;
        display: flex;
        flex-direction: column;
      }
      #root .wm-detail-inline {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(0,0,0,.08);
      }
      #root .wm-detail-scroll { flex: 1 1 auto; overflow-y: auto; }

      /* ── 한눈에 보기: 한 줄로 쌓고 통째로 스크롤 ── */
      #root .wm-overview {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #root .wm-ov-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      #root .wm-ov-col { flex: 0 0 auto; }
      #root .wm-ov-catlist { display: grid; gap: 10px; }
      #root .wm-ov-hint { text-align: center; }
      #root .wm-ov-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 6px;
        border-radius: 8px;
        border-bottom: 1px solid rgba(148,163,184,.18);
      }
      #root .wm-ov-row:last-child { border-bottom: none; }

      /* ── 새 과제: 가운데 창 ── */
      #root .wm-form { max-width: 560px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ═══ Firebase — minsung-buboo2 (민성 스케줄·Book Tracker와 같은 프로젝트) ═══
    // 같은 계정으로 로그인해야 uid가 같아져서 개인일정 연동이 동작한다.
    const firebaseConfig = {
      apiKey: 'AIzaSyAPXiob8XeDunXpDMsLod_TwClqg2JL260',
      authDomain: 'minsung-buboo2.firebaseapp.com',
      databaseURL: 'https://minsung-buboo2-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'minsung-buboo2',
      storageBucket: 'minsung-buboo2.firebasestorage.app',
      messagingSenderId: '318424534715',
      appId: '1:318424534715:web:50a3b43ea5c5325ee5239e'
    };
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
  </script>

  <script src="./app.js?v=20261015"></script>
  <script>
  // 주소 이전 (2026-10-15): github.io 공용 주소 → 전용 주소. 옛 주소에선 맨 위에 이동 띠(로그인 화면 위에도).
  // 목표·일정은 계정(RTDB)에 있어 옮길 것이 없다. 새 주소에선 로그인만 한 번 다시
  (function () {
    if (!/(^|\.)github\.io$/.test(location.hostname)) return;
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:100000;background:#f59e0b;color:#111;padding:10px 12px;text-align:center;font-size:14px;line-height:1.5;font-weight:600';
    bar.innerHTML = '목표 관리가 새 주소로 옮겼습니다 <a href="https://minsung-goals.web.app/" style="margin-left:8px;padding:4px 12px;border-radius:6px;background:#111;color:#fff;text-decoration:none">새 주소로 이동</a>';
    document.body.appendChild(bar);
  })();
  </script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(){});
      });
    }
  </script>
</body>
</html>
