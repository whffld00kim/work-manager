<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="업무관리" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>업무현황 관리</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>tailwind.config = { darkMode: 'class' };</script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    * { box-sizing: border-box; }
    /* Safe area for Galaxy Fold / notched phones */
    body { padding-bottom: env(safe-area-inset-bottom); }
    header { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" data-type="application/javascript">
    const { useState, useEffect, useMemo, useRef } = React;

    // ═══════════════════════════════════════════════════
    //  Utilities
    // ═══════════════════════════════════════════════════
    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
    function today() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(d) {
      if (!d) return '─';
      const [y, m, dd] = d.split('-');
      return `${y}.${m}.${dd}`;
    }
    function dday(targetDate, status) {
      if (!targetDate || status === 'Completed') return null;
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const t = new Date(targetDate + 'T00:00:00');
      const n = Math.floor((t - now) / 86400000);
      if (n === 0) return { text: 'D-Day', cls: 'text-amber-500 font-bold' };
      if (n > 0) return { text: `D-${n}`, cls: n <= 3 ? 'text-orange-500 font-semibold' : 'text-sky-500' };
      return { text: `D+${Math.abs(n)} 초과`, cls: 'text-red-500 font-semibold' };
    }
    function isThisWeek(d) {
      if (!d) return false;
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const dow = now.getDay();
      const mon = new Date(now); mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1));
      const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23, 59, 59, 999);
      return new Date(d + 'T00:00:00') >= mon && new Date(d + 'T00:00:00') <= sun;
    }
    function exportCSV(tasks) {
      const H = ['발생일','업무구분','업무내용','업무상세','목표일정','현재상태','달성일정','우선순위'];
      const rows = tasks.map(t => [
        t.createdAt, t.category,
        `"${(t.title||'').replace(/"/g,'""')}"`,
        `"${(t.detail||'').replace(/"/g,'""')}"`,
        t.targetDate, t.status, t.completedAt||'', t.priority,
      ]);
      const csv = '\uFEFF' + [H,...rows].map(r=>r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      a.download = `업무현황_${today()}.csv`; a.click();
    }
    function exportJSON(tasks) {
      const json = JSON.stringify(tasks, null, 2);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json],{type:'application/json'}));
      a.download = `업무현황_백업_${today()}.json`; a.click();
    }

    // ═══════════════════════════════════════════════════
    //  Constants
    // ═══════════════════════════════════════════════════
    const CATS  = ['Executive','Myself','Part Leader','etc'];
    const STATS = ['In Progress','Completed'];
    const PRIS  = ['High','Medium','Low'];
    const PRI_ORD = { High:0, Medium:1, Low:2 };
    const CAT_CLS = {
      Executive:    'bg-violet-100 text-violet-800 dark:bg-violet-900/40 dark:text-violet-300',
      Myself:       'bg-sky-100    text-sky-800    dark:bg-sky-900/40    dark:text-sky-300',
      'Part Leader':'bg-orange-100 text-orange-800 dark:bg-orange-900/40 dark:text-orange-300',
      etc:          'bg-slate-100  text-slate-600  dark:bg-slate-700     dark:text-slate-300',
    };
    const STAT_CLS = {
      'In Progress':'bg-blue-100   text-blue-700   dark:bg-blue-900/40   dark:text-blue-300',
      Completed:    'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',
    };
    const PRI_CLS = {
      High:  'bg-red-100   text-red-700   dark:bg-red-900/40   dark:text-red-300',
      Medium:'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300',
      Low:   'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300',
    };

    // ═══════════════════════════════════════════════════
    //  Shared style helpers
    // ═══════════════════════════════════════════════════
    const inputCls = "w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition";
    const labelCls = "block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1";
    const selCls   = "px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500";

    // ═══════════════════════════════════════════════════
    //  Badge
    // ═══════════════════════════════════════════════════
    function Badge({ cls, children }) {
      return <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap ${cls}`}>{children}</span>;
    }

    // ═══════════════════════════════════════════════════
    //  Toast
    // ═══════════════════════════════════════════════════
    function Toast({ toast }) {
      if (!toast) return null;
      const bg = toast.type === 'error' ? 'bg-red-500' : toast.type === 'warn' ? 'bg-amber-500' : 'bg-emerald-500';
      return (
        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl shadow-2xl text-sm font-semibold text-white ${bg} max-w-xs text-center`}
          style={{ bottom: 'calc(2rem + env(safe-area-inset-bottom))' }}>
          {toast.msg}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  Dashboard
    // ═══════════════════════════════════════════════════
    function Dashboard({ tasks }) {
      const total   = tasks.length;
      const inProg  = tasks.filter(t => t.status === 'In Progress').length;
      const done    = tasks.filter(t => t.status === 'Completed').length;
      const weekDue = tasks.filter(t => t.status !== 'Completed' && isThisWeek(t.targetDate)).length;
      const catCnt  = Object.fromEntries(CATS.map(c => [c, tasks.filter(t => t.category === c).length]));
      const maxCat  = Math.max(1, ...Object.values(catCnt));
      return (
        <div className="mb-5 space-y-3">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {[
              { label:'전체',        val:total,   dot:'bg-slate-400'   },
              { label:'In Progress', val:inProg,  dot:'bg-blue-500'    },
              { label:'Completed',   val:done,    dot:'bg-emerald-500' },
              { label:'금주 마감',   val:weekDue, dot:'bg-orange-500'  },
            ].map(({ label, val, dot }) => (
              <div key={label} className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700">
                <div className={`w-2.5 h-2.5 rounded-full ${dot} mb-2`}/>
                <div className="text-2xl font-extrabold text-slate-800 dark:text-white">{val}</div>
                <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{label}</div>
              </div>
            ))}
          </div>
          <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700">
            <div className="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-3">업무구분별</div>
            <div className="space-y-2">
              {CATS.map(c => (
                <div key={c} className="flex items-center gap-3">
                  <div className="w-24 shrink-0"><Badge cls={CAT_CLS[c]}>{c}</Badge></div>
                  <div className="flex-1 bg-slate-100 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
                    <div className="h-2 rounded-full bg-blue-500 transition-all" style={{ width:`${(catCnt[c]/maxCat)*100}%` }}/>
                  </div>
                  <div className="w-5 text-right text-sm font-bold text-slate-700 dark:text-slate-300">{catCnt[c]}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  FilterBar
    // ═══════════════════════════════════════════════════
    function FilterBar({ filters, setFilters, sort, setSort, onAdd }) {
      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-4">
          <div className="flex flex-wrap gap-2 items-center">
            <input type="text" placeholder="🔍  업무내용 검색..." value={filters.search}
              onChange={e=>setFilters(f=>({...f,search:e.target.value}))}
              className={`flex-1 min-w-[160px] ${selCls}`}/>
            <select value={filters.category} onChange={e=>setFilters(f=>({...f,category:e.target.value}))} className={selCls}>
              <option value="">전체 구분</option>
              {CATS.map(c=><option key={c}>{c}</option>)}
            </select>
            <select value={filters.status} onChange={e=>setFilters(f=>({...f,status:e.target.value}))} className={selCls}>
              <option value="">전체 상태</option>
              {STATS.map(s=><option key={s}>{s}</option>)}
            </select>
            <select value={filters.priority} onChange={e=>setFilters(f=>({...f,priority:e.target.value}))} className={selCls}>
              <option value="">전체 우선순위</option>
              {PRIS.map(p=><option key={p}>{p}</option>)}
            </select>
            <select value={`${sort.field}:${sort.dir}`}
              onChange={e=>{const[field,dir]=e.target.value.split(':');setSort({field,dir});}} className={selCls}>
              <option value="createdAt:desc">발생일 최신</option>
              <option value="createdAt:asc">발생일 오래된</option>
              <option value="targetDate:asc">목표일정 빠른</option>
              <option value="targetDate:desc">목표일정 느린</option>
              <option value="priority:asc">우선순위 높은</option>
              <option value="priority:desc">우선순위 낮은</option>
            </select>
            <button onClick={onAdd}
              className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-colors">
              + 업무 등록
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  TaskTable + TaskRow
    // ═══════════════════════════════════════════════════
    function TaskTable({ tasks, onSelect }) {
      if (!tasks.length) return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-16 text-center shadow-sm">
          <div className="text-5xl mb-3">📋</div>
          <div className="text-slate-400 dark:text-slate-500">등록된 업무가 없습니다</div>
        </div>
      );
      return (
        <>
          {/* ── 넓은 화면(640px+): 테이블 ── */}
          <div className="hidden sm:block bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-slate-50 dark:bg-slate-700/50 text-left">
                    {['발생일','구분','업무내용','목표일정','상태','우선순위','이력'].map(h=>(
                      <th key={h} className="px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {tasks.map(t=><TaskRow key={t.id} task={t} onClick={onSelect}/>)}
                </tbody>
              </table>
            </div>
          </div>

          {/* ── 좁은 화면(폴드 분할·커버): 카드 목록 ── */}
          <div className="sm:hidden space-y-2">
            {tasks.map(t=><TaskCard key={t.id} task={t} onClick={onSelect}/>)}
          </div>
        </>
      );
    }

    function TaskCard({ task, onClick }) {
      const dd = dday(task.targetDate, task.status);
      return (
        <div onClick={()=>onClick(task)}
          className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-3 shadow-sm cursor-pointer active:bg-blue-50 dark:active:bg-slate-700/60 transition-colors">
          <div className="flex flex-wrap items-center gap-1 mb-1.5">
            <Badge cls={CAT_CLS[task.category]}>{task.category}</Badge>
            <Badge cls={STAT_CLS[task.status]}>{task.status}</Badge>
            <Badge cls={PRI_CLS[task.priority]}>{task.priority}</Badge>
          </div>
          <div className="font-medium text-slate-800 dark:text-white text-sm truncate">{task.title}</div>
          {task.detail&&<div className="text-xs text-slate-400 truncate mt-0.5">{task.detail}</div>}
          <div className="flex items-center justify-between mt-2 text-xs text-slate-400 dark:text-slate-500">
            <span className="whitespace-nowrap">
              {fmtDate(task.createdAt)} → {fmtDate(task.targetDate)}
              {dd&&<span className={`ml-1 font-medium ${dd.cls}`}>{dd.text}</span>}
            </span>
            <span className="whitespace-nowrap shrink-0 ml-2">이력 {task.history?.length||0}건</span>
          </div>
        </div>
      );
    }

    function TaskRow({ task, onClick }) {
      const dd = dday(task.targetDate, task.status);
      return (
        <tr onClick={()=>onClick(task)}
          className="hover:bg-blue-50 dark:hover:bg-slate-700/60 cursor-pointer transition-colors border-b border-slate-100 dark:border-slate-700/60 last:border-0">
          <td className="px-4 py-3 text-slate-500 dark:text-slate-400 whitespace-nowrap">{fmtDate(task.createdAt)}</td>
          <td className="px-4 py-3"><Badge cls={CAT_CLS[task.category]}>{task.category}</Badge></td>
          <td className="px-4 py-3 max-w-xs">
            <div className="font-medium text-slate-800 dark:text-white truncate">{task.title}</div>
            {task.detail&&<div className="text-xs text-slate-400 truncate mt-0.5">{task.detail}</div>}
          </td>
          <td className="px-4 py-3 whitespace-nowrap">
            <div className="text-slate-600 dark:text-slate-400">{fmtDate(task.targetDate)}</div>
            {dd&&<div className={`text-xs mt-0.5 ${dd.cls}`}>{dd.text}</div>}
          </td>
          <td className="px-4 py-3"><Badge cls={STAT_CLS[task.status]}>{task.status}</Badge></td>
          <td className="px-4 py-3"><Badge cls={PRI_CLS[task.priority]}>{task.priority}</Badge></td>
          <td className="px-4 py-3 text-slate-400 dark:text-slate-500">{task.history?.length||0}건</td>
        </tr>
      );
    }

    // ═══════════════════════════════════════════════════
    //  TaskForm Modal
    // ═══════════════════════════════════════════════════
    function TaskForm({ initial, onSave, onClose }) {
      const isEdit = !!initial;
      const [f, setF] = useState(initial ?? {
        createdAt:today(), category:'Executive', title:'', detail:'',
        targetDate:'', status:'In Progress', priority:'Medium', completedAt:'', history:[],
      });
      function set(k,v) {
        setF(p=>{ const n={...p,[k]:v}; if(k==='status'&&v==='In Progress') n.completedAt=''; return n; });
      }
      function submit(e) {
        e.preventDefault();
        if (!f.title.trim()) return;
        onSave({...f, id:f.id||genId(), history:f.history||[]});
        onClose();
      }
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose}/>
          <div className="relative bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden">
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700 shrink-0">
              <h2 className="font-bold text-slate-800 dark:text-white">{isEdit?'업무 편집':'업무 등록'}</h2>
              <button onClick={onClose} className="text-2xl leading-none text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">&times;</button>
            </div>
            <form onSubmit={submit} className="flex-1 overflow-y-auto px-6 py-5 space-y-4">
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelCls}>발생일 *</label>
                  <input type="date" required value={f.createdAt} onChange={e=>set('createdAt',e.target.value)} className={inputCls}/></div>
                <div><label className={labelCls}>목표일정 *</label>
                  <input type="date" required value={f.targetDate} onChange={e=>set('targetDate',e.target.value)} className={inputCls}/></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelCls}>업무구분 *</label>
                  <select value={f.category} onChange={e=>set('category',e.target.value)} className={inputCls}>
                    {CATS.map(c=><option key={c}>{c}</option>)}</select></div>
                <div><label className={labelCls}>우선순위 *</label>
                  <select value={f.priority} onChange={e=>set('priority',e.target.value)} className={inputCls}>
                    {PRIS.map(p=><option key={p}>{p}</option>)}</select></div>
              </div>
              <div><label className={labelCls}>업무내용 *</label>
                <input type="text" required placeholder="업무 제목을 입력하세요" value={f.title} onChange={e=>set('title',e.target.value)} className={inputCls}/></div>
              <div><label className={labelCls}>업무 상세 <span className="font-normal text-slate-400">(선택)</span></label>
                <textarea rows={3} value={f.detail} onChange={e=>set('detail',e.target.value)} className={`${inputCls} resize-none`}/></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className={labelCls}>현재상태</label>
                  <select value={f.status} onChange={e=>set('status',e.target.value)} className={inputCls}>
                    {STATS.map(s=><option key={s}>{s}</option>)}</select></div>
                <div><label className={labelCls}>달성일정 {f.status==='Completed'&&<span className="text-red-400">*</span>}</label>
                  <input type="date" disabled={f.status!=='Completed'} value={f.completedAt||''} onChange={e=>set('completedAt',e.target.value)}
                    className={`${inputCls} disabled:opacity-40 disabled:cursor-not-allowed`}/></div>
              </div>
              <div className="flex gap-3 pb-1">
                <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl">{isEdit?'수정 완료':'등록'}</button>
                <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-bold text-sm rounded-xl">취소</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  HistoryTimeline
    // ═══════════════════════════════════════════════════
    function HistoryTimeline({ history, onAdd, onDelete }) {
      const [dt, setDt]     = useState(today);
      const [note, setNote] = useState('');
      function add() { if (!note.trim()) return; onAdd({date:dt,note:note.trim()}); setNote(''); }
      const sorted = [...(history||[])].sort((a,b)=>a.date.localeCompare(b.date));
      return (
        <div>
          <div className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3">진행이력</div>
          <div className="flex gap-2 mb-4">
            <input type="date" value={dt} onChange={e=>setDt(e.target.value)}
              className="px-2 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500"/>
            <input type="text" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}
              placeholder="이력 메모 (Enter)"
              className="flex-1 px-2 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-blue-500"/>
            <button onClick={add} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-lg">추가</button>
          </div>
          {!sorted.length
            ? <p className="text-xs text-center text-slate-400 py-4">이력이 없습니다</p>
            : <div className="relative pl-6">
                <div className="absolute left-2 top-1 bottom-1 w-0.5 bg-slate-200 dark:bg-slate-700 rounded-full"/>
                <div className="space-y-3">
                  {sorted.map((item,i)=>(
                    <div key={i} className="relative flex items-start gap-2">
                      <div className="absolute -left-4 top-1.5 w-3 h-3 rounded-full bg-blue-500 ring-2 ring-white dark:ring-slate-800 shrink-0"/>
                      <div className="flex-1 bg-slate-50 dark:bg-slate-700/50 rounded-xl p-2.5 min-w-0">
                        <div className="text-xs text-slate-400 mb-0.5">{fmtDate(item.date)}</div>
                        <div className="text-sm text-slate-700 dark:text-slate-200 break-words">{item.note}</div>
                      </div>
                      <button onClick={()=>onDelete(i)}
                        className="shrink-0 mt-1 text-slate-300 hover:text-red-500 dark:text-slate-600 dark:hover:text-red-400 text-lg leading-none">×</button>
                    </div>
                  ))}
                </div>
              </div>
          }
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  TaskDetailPanel
    // ═══════════════════════════════════════════════════
    function TaskDetailPanel({ task, onClose, onUpdate, onDelete }) {
      const [editing, setEditing] = useState(false);
      const [f, setF] = useState(task);
      useEffect(()=>{ setF(task); setEditing(false); }, [task?.id]);
      if (!task) return null;
      function set(k,v) { setF(p=>{ const n={...p,[k]:v}; if(k==='status'&&v==='In Progress') n.completedAt=''; return n; }); }
      function save() { onUpdate(f); setEditing(false); }
      function addHistory(item) { const updated={...task,history:[...(task.history||[]),item]}; onUpdate(updated); }
      function delHistory(idx)  { const h=[...(task.history||[])]; h.splice(idx,1); onUpdate({...task,history:h}); }
      const dd = dday(task.targetDate, task.status);
      return (
        <div className="fixed inset-0 z-40 flex">
          <div className="flex-1 bg-black/30 backdrop-blur-sm" onClick={onClose}/>
          <div className="w-full max-w-md bg-white dark:bg-slate-800 shadow-2xl flex flex-col">
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200 dark:border-slate-700 shrink-0">
              <div className="flex items-center gap-2 flex-wrap">
                <Badge cls={STAT_CLS[task.status]}>{task.status}</Badge>
                <Badge cls={PRI_CLS[task.priority]}>{task.priority}</Badge>
                {dd&&<span className={`text-xs ${dd.cls}`}>{dd.text}</span>}
              </div>
              <div className="flex items-center gap-2 shrink-0">
                {!editing&&<button onClick={()=>setEditing(true)}
                  className="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg">편집</button>}
                <button onClick={()=>{if(confirm('삭제하시겠습니까?'))onDelete(task.id);}}
                  className="px-3 py-1.5 text-xs bg-red-100 hover:bg-red-200 text-red-600 dark:bg-red-900/30 dark:text-red-400 rounded-lg">삭제</button>
                <button onClick={onClose} className="text-2xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-5 space-y-5">
              {editing ? (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className={labelCls}>발생일</label>
                      <input type="date" value={f.createdAt} onChange={e=>set('createdAt',e.target.value)} className={inputCls}/></div>
                    <div><label className={labelCls}>목표일정</label>
                      <input type="date" value={f.targetDate} onChange={e=>set('targetDate',e.target.value)} className={inputCls}/></div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className={labelCls}>업무구분</label>
                      <select value={f.category} onChange={e=>set('category',e.target.value)} className={inputCls}>
                        {CATS.map(c=><option key={c}>{c}</option>)}</select></div>
                    <div><label className={labelCls}>우선순위</label>
                      <select value={f.priority} onChange={e=>set('priority',e.target.value)} className={inputCls}>
                        {PRIS.map(p=><option key={p}>{p}</option>)}</select></div>
                  </div>
                  <div><label className={labelCls}>업무내용</label>
                    <input type="text" value={f.title} onChange={e=>set('title',e.target.value)} className={inputCls}/></div>
                  <div><label className={labelCls}>업무 상세</label>
                    <textarea rows={3} value={f.detail||''} onChange={e=>set('detail',e.target.value)} className={`${inputCls} resize-none`}/></div>
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className={labelCls}>현재상태</label>
                      <select value={f.status} onChange={e=>set('status',e.target.value)} className={inputCls}>
                        {STATS.map(s=><option key={s}>{s}</option>)}</select></div>
                    <div><label className={labelCls}>달성일정</label>
                      <input type="date" disabled={f.status!=='Completed'} value={f.completedAt||''} onChange={e=>set('completedAt',e.target.value)}
                        className={`${inputCls} disabled:opacity-40 disabled:cursor-not-allowed`}/></div>
                  </div>
                  <div className="flex gap-3">
                    <button onClick={save} className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl">저장</button>
                    <button onClick={()=>{setEditing(false);setF(task);}} className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold text-sm rounded-xl">취소</button>
                  </div>
                </div>
              ) : (
                <div className="space-y-4">
                  <div>
                    <div className="text-xs text-slate-400 mb-1">업무내용</div>
                    <div className="text-base font-bold text-slate-800 dark:text-white">{task.title}</div>
                    {task.detail&&<div className="mt-2 text-sm text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/50 rounded-xl p-3 leading-relaxed whitespace-pre-wrap">{task.detail}</div>}
                  </div>
                  <div className="grid grid-cols-2 gap-3 text-sm">
                    {[['발생일',fmtDate(task.createdAt)],['목표일정',fmtDate(task.targetDate)],['달성일정',task.completedAt?fmtDate(task.completedAt):'─']].map(([k,v])=>(
                      <div key={k} className="bg-slate-50 dark:bg-slate-700/40 rounded-xl p-3">
                        <div className="text-xs text-slate-400 mb-0.5">{k}</div>
                        <div className="font-medium text-slate-700 dark:text-slate-200">{v}</div>
                      </div>
                    ))}
                    <div className="bg-slate-50 dark:bg-slate-700/40 rounded-xl p-3">
                      <div className="text-xs text-slate-400 mb-1">업무구분</div>
                      <Badge cls={CAT_CLS[task.category]}>{task.category}</Badge>
                    </div>
                  </div>
                </div>
              )}
              <div className="border-t border-slate-200 dark:border-slate-700 pt-4">
                <HistoryTimeline history={task.history} onAdd={addHistory} onDelete={delHistory}/>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  App (Root)
    // ═══════════════════════════════════════════════════
    function App() {
      const [tasks, setTasks] = useState(()=>{
        try { return JSON.parse(localStorage.getItem('wm-tasks')||'[]'); } catch { return []; }
      });
      const [dark, setDark] = useState(()=>
        localStorage.getItem('wm-dark')==='true' ||
        (!localStorage.getItem('wm-dark') && window.matchMedia('(prefers-color-scheme:dark)').matches)
      );
      const [selected,  setSelected]  = useState(null);
      const [showForm,  setShowForm]  = useState(false);
      const [filters,   setFilters]   = useState({ category:'', status:'In Progress', priority:'', search:'' });
      const [sort,      setSort]      = useState({ field:'createdAt', dir:'desc' });
      const [toast,     setToast]     = useState(null);
      const importRef = useRef(null);

      // Persist
      useEffect(()=>{ localStorage.setItem('wm-tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(()=>{
        localStorage.setItem('wm-dark', dark);
        document.documentElement.classList.toggle('dark', dark);
      }, [dark]);
      useEffect(()=>{
        if (selected) {
          const fresh = tasks.find(t=>t.id===selected.id);
          if (fresh) setSelected(fresh);
        }
      }, [tasks]);

      function showToast(msg, type='success') {
        setToast({ msg, type });
        setTimeout(()=>setToast(null), 3500);
      }

      // CRUD
      function addTask(t)     { setTasks(p=>[t,...p]); }
      function updateTask(t)  { setTasks(p=>p.map(x=>x.id===t.id?t:x)); }
      function deleteTask(id) { setTasks(p=>p.filter(x=>x.id!==id)); setSelected(null); }

      // JSON 불러오기
      function handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) throw new Error('올바른 백업 파일이 아닙니다.');
            if (!confirm(`${data.length}건의 데이터를 불러옵니다.\n현재 데이터는 유지되고 새 항목이 추가됩니다.\n계속하시겠습니까?`)) return;
            // 중복 id 제외하고 병합
            setTasks(prev => {
              const existingIds = new Set(prev.map(t => t.id));
              const newItems = data.filter(t => !existingIds.has(t.id));
              return [...prev, ...newItems];
            });
            showToast(`📂 ${data.length}건 불러오기 완료`);
          } catch(err) {
            showToast('불러오기 실패: ' + err.message, 'error');
          }
          e.target.value = ''; // 같은 파일 재선택 가능하도록 초기화
        };
        reader.readAsText(file);
      }

      function copyURL() {
        const url = window.location.href;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(()=>showToast('🔗 URL 복사 완료! 카카오톡에 붙여넣으세요')).catch(fallback);
        } else { fallback(); }
        function fallback() {
          const el = document.createElement('textarea');
          el.value = url; el.style.position='fixed'; el.style.opacity='0';
          document.body.appendChild(el); el.select(); document.execCommand('copy');
          document.body.removeChild(el);
          showToast('🔗 URL 복사 완료! 카카오톡에 붙여넣으세요');
        }
      }

      // Filtered + sorted tasks
      const visible = useMemo(()=>{
        let r = [...tasks];
        if (filters.category) r = r.filter(t=>t.category===filters.category);
        if (filters.status)   r = r.filter(t=>t.status===filters.status);
        if (filters.priority) r = r.filter(t=>t.priority===filters.priority);
        if (filters.search) {
          const q = filters.search.toLowerCase();
          r = r.filter(t=>t.title.toLowerCase().includes(q)||(t.detail||'').toLowerCase().includes(q));
        }
        r.sort((a,b)=>{
          const mul = sort.dir==='asc'?1:-1;
          if (sort.field==='priority') return mul*(PRI_ORD[a.priority]-PRI_ORD[b.priority]);
          return mul*(a[sort.field]||'').localeCompare(b[sort.field]||'');
        });
        return r;
      }, [tasks, filters, sort]);

      return (
        <div className="min-h-screen bg-slate-100 dark:bg-slate-900 transition-colors duration-200">

          {/* ── Header ── */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
            <div className="max-w-7xl mx-auto px-3 sm:px-4 py-3 flex items-center justify-between gap-2">
              {/* Title */}
              <div className="flex items-center gap-2 min-w-0">
                <img src="icon.svg" alt="" className="w-7 h-7 shrink-0"/>
                <div className="min-w-0">
                  <h1 className="font-extrabold text-slate-800 dark:text-white leading-tight text-sm sm:text-base truncate">업무현황 관리</h1>
                  <p className="text-xs text-slate-400 dark:text-slate-500">{tasks.length}건</p>
                </div>
              </div>

              {/* Action buttons */}
              <div className="flex items-center gap-1.5 shrink-0 flex-wrap justify-end">

                {/* URL 복사 */}
                <button onClick={copyURL} title="URL 복사 (카카오톡 공유)"
                  className="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 transition-colors">
                  🔗 <span className="hidden sm:inline">URL 복사</span>
                </button>

                {/* 불러오기 */}
                <input ref={importRef} type="file" accept=".json" className="hidden" onChange={handleImport}/>
                <button onClick={()=>importRef.current.click()} title="JSON 백업 파일 불러오기"
                  className="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 transition-colors">
                  📂 <span className="hidden sm:inline">불러오기</span>
                </button>

                {/* 내보내기 */}
                <button onClick={()=>exportJSON(tasks)} title="JSON 백업 파일 내보내기"
                  className="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 transition-colors">
                  💾 <span className="hidden sm:inline">내보내기</span>
                </button>

                {/* Dark mode */}
                <button onClick={()=>setDark(d=>!d)}
                  className="w-9 h-9 flex items-center justify-center bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl transition-colors text-base">
                  {dark?'☀️':'🌙'}
                </button>
              </div>
            </div>
          </header>

          {/* ── Main ── */}
          <main className="max-w-7xl mx-auto px-3 sm:px-4 py-6">
            <Dashboard tasks={tasks}/>
            <FilterBar filters={filters} setFilters={setFilters} sort={sort} setSort={setSort} onAdd={()=>setShowForm(true)}/>
            <TaskTable tasks={visible} onSelect={setSelected}/>
          </main>

          {/* ── Modals / Panels ── */}
          {showForm && <TaskForm onSave={addTask} onClose={()=>setShowForm(false)}/>}
          {selected && (
            <TaskDetailPanel task={selected} onClose={()=>setSelected(null)}
              onUpdate={updateTask} onDelete={deleteTask}/>
          )}
          <Toast toast={toast}/>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <!-- Service Worker registration (runs after page load) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function(reg) {
            console.log('[SW] Registered, scope:', reg.scope);
            // Check for updates
            reg.addEventListener('updatefound', function() {
              const newSW = reg.installing;
              newSW.addEventListener('statechange', function() {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] New version available. Reload to update.');
                }
              });
            });
          })
          .catch(function(err) {
            console.warn('[SW] Registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
